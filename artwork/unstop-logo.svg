  <!--
    Upper break cap. It stays flat at the break face, while preserving
    the original-style stronger rounding on the inner-opening corner.
  -->
  <g transform="translate(760 382) rotate(45)" fill="url(#purple)">
    <path d="M -26,-52
             L -7,-52
             Q 0,-52 0,-45
             L 0,36
             Q 0,52 -16,52
             L -26,52 Z"/>
  </g>

  <!-- Exact reflected lower break cap. -->
  <g transform="matrix(0 -1 -1 0 1270 1270)">
