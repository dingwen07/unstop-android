  <title id="title">Symmetric purple external-link icon</title>
  <desc id="desc">A purple external-link icon with a symmetric open octagonal frame, smoothly rounded inner octagon turns, original arrowhead geometry, lightly rounded arrow tail, and rounded break corners.</desc>

  <defs>
    <!-- The gradient is aligned with the x+y=1270 symmetry axis. -->
    <linearGradient id="purple" gradientUnits="userSpaceOnUse"
                    x1="223" y1="1047" x2="1070" y2="200">
      <stop offset="0" stop-color="#644FA6"/>
      <stop offset="0.5" stop-color="#6550A7"/>
      <stop offset="1" stop-color="#6651A7"/>
    </linearGradient>
  </defs>

